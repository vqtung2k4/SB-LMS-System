<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - LMS</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous"
    />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"
    ></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!--Navbar-->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">MyLMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/login}"
                    >Login</a
                    >
                </li>
                <li class="nav-item">
                    <a
                            class="nav-link"
                            th:href="@{/auth/register}"
                    >Register</a
                    >
                </li>
            </ul>
        </div>
    </div>
</nav>
<!--END Navbar-->
<main class="flex-grow-1">
    <div class="container mt-5" style="max-width: 500px">
        <h2>Login</h2>

        <div th:if="${error}" role="alert" class="alert alert-danger">
            <span th:text="${error}">Invalid credentials</span>
        </div>

        <div th:if="${message}" role="alert" class="alert alert-success">
            <span th:text="${message}">Login Success</span>
        </div>

        <form th:action="@{/authenticate}" method="post">
            <div class="mb-3">
                <label for="username">Email</label>
                <input
                        id="username"
                        type="email"
                        name="username"
                        class="form-control"
                        placeholder="Enter your email"
                        th:value="${email}"
                        required
                />
            </div>

            <div class="mb-3">
                <label for="password">Password</label>
                <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                />
            </div>

            <button type="submit" class="btn btn-dark">Login</button>
        </form>

        <div class="mt-3">
            <p>Don't have account? <a th:href="@{/auth/register}">Register here</a></p>
        </div>
    </div>
</main>

<!--Footer-->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <p>&copy; 2025 MyLMS. All rights reserved.</p>
</footer>
<!--END Footer-->
</body>
</html>
