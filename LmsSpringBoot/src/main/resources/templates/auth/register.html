<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - LMS</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous"
    />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"
    ></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!--Navbar-->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">MyLMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/login}"
                    >Login</a
                    >
                </li>
                <li class="nav-item">
                    <a
                            class="nav-link"
                            th:href="@{/auth/register}"
                    >Register</a
                    >
                </li>
            </ul>
        </div>
    </div>
</nav>
<!--END Navbar-->

<div
        class="container-fluid vh-100 d-flex align-items-center justify-content-center"
>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2>Register</h2>
            <span class="text-secondary"
            >Create a new account to get started</span
            >
            <form th:action="@{/auth/register}" method="post">
                <div class="mb-3">
                    <label>Full Name</label>
                    <input
                            class="form-control"
                            name="fullname"
                            type="text"
                            placeholder="Enter your Full Name"
                            required
                    />
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input
                            class="form-control"
                            name="email"
                            type="email"
                            placeholder="Enter your email"
                            required
                    />
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input
                            class="form-control"
                            name="password"
                            type="password"
                            placeholder="Enter your password"
                            required
                    />
                </div>

                <div class="mb-3">
                    <label>Role</label>
                    <select class="form-select" name="role" required>
                        <option value="student" selected>Student</option>
                        <option value="instructor">Instructor</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-dark w-100 mt-3">
                    Register
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
