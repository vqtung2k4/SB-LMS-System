<!doctype html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMS System</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous"
    />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"
    ></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!--Navbar-->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index.html}">MyLMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/auth/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link disabled" th:href="@{/auth/register}" aria-disabled="true">Register</a>
                </li>

                
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Admin Dashboard</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('INSTRUCTOR')">
                    <a class="nav-link" th:href="@{/instructor/dashboard}">Instructor Dashboard</a>
                </li>


                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-link nav-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!--END Navbar-->

<main class="flex-grow-1">
    <div class="container mt-5 text-center">
        <h1>Welcome to MyLMS</h1>
        <p class="lead">Your Learning Starts Here</p>
        
        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/auth/login}" class="btn btn-primary">Login</a>
            <a th:href="@{/auth/register}" class="btn btn-secondary disabled" aria-disabled="true">Register</a>
        </div>

        <script sec:authorize="isAuthenticated()">
            document.addEventListener('DOMContentLoaded', function() {
                var userRoles = /*[[${#authentication.authorities}]]*/ [];

                if (userRoles.some(role => role.authority === 'ROLE_ADMIN')) {
                    window.location.href = '/admin/dashboard';
                } else if (userRoles.some(role => role.authority === 'ROLE_INSTRUCTOR')) {
                    window.location.href = '/instructor/dashboard';
                }
            });
        </script>

    </div>
</main>

<!--Footer-->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <p>&copy; 2025 MyLMS. All rights reserved.</p>
</footer>
<!--END Footer-->
</body>
</html>
